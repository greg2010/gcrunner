name: Build GCE Runner Images

on:
  push:
    branches: [deploy]
    paths:
      - 'images/**'
      - 'cache-server/**'
  schedule:
    - cron: '0 6 * * 1'  # Monday 6am UTC
  workflow_dispatch:
    inputs:
      family:
        description: 'Image family to build (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ubuntu2404-x64
          - ubuntu2204-x64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: build-images-${{ matrix.family }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON((github.event.inputs.family || 'all') == 'all' && '["ubuntu2404-x64","ubuntu2204-x64"]' || format('["{0}"]', github.event.inputs.family)) }}

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cache-server/go.mod
          cache-dependency-path: cache-server/go.sum

      - name: Build cache-server
        run: |
          cd cache-server
          GOOS=linux GOARCH=amd64 go build -o cache-server .

      - name: Install Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: '1.16.0'

      - name: Init Packer
        working-directory: images
        run: packer init .

      - name: Validate Packer
        working-directory: images
        run: packer validate -var-file="${{ matrix.family }}.pkrvars.hcl" -var "project_id=${{ vars.PACKER_PROJECT_ID }}" .

      - name: Build Image
        working-directory: images
        run: packer build -var-file="${{ matrix.family }}.pkrvars.hcl" -var "project_id=${{ vars.PACKER_PROJECT_ID }}" .

      - name: Create smoke-test VM
        run: |
          LATEST_IMAGE=$(gcloud compute images list \
            --project="${{ vars.PACKER_PROJECT_ID }}" \
            --filter="family=gcrunner-${{ matrix.family }}" \
            --sort-by="~creationTimestamp" \
            --limit=1 \
            --format="value(name)")
          VM_NAME="smoke-test-${{ matrix.family }}-${{ github.run_id }}"
          echo "VM_NAME=${VM_NAME}" >> "$GITHUB_ENV"

          gcloud compute instances create "${VM_NAME}" \
            --project="${{ vars.PACKER_PROJECT_ID }}" \
            --zone="us-central1-a" \
            --machine-type=e2-small \
            --image="${LATEST_IMAGE}" \
            --image-project="${{ vars.PACKER_PROJECT_ID }}"

          # Wait for VM to boot
          sleep 30

      - name: Smoke test
        run: |
          gcloud compute ssh "${VM_NAME}" --zone="us-central1-a" --project="${{ vars.PACKER_PROJECT_ID }}" --command="
            set -e
            test -f /home/runner/run.sh && echo 'PASS: run.sh'
            test -d /opt/hostedtoolcache && echo 'PASS: hostedtoolcache'
            docker --version && echo 'PASS: docker'
            gcloud --version | head -1 && echo 'PASS: gcloud'
            git --version && echo 'PASS: git'
            gh --version | head -1 && echo 'PASS: gh'
            node --version && echo 'PASS: node'
            python3 --version && echo 'PASS: python3'
            rustc --version && echo 'PASS: rust'
            java -version 2>&1 | head -1 && echo 'PASS: java'
            test -x /usr/local/bin/cache-server && echo 'PASS: cache-server'
          "

      - name: Delete smoke-test VM
        if: always() && env.VM_NAME != ''
        run: gcloud compute instances delete "${VM_NAME}" --zone="us-central1-a" --project="${{ vars.PACKER_PROJECT_ID }}" --quiet

      - name: Delete old images
        run: |
          OLD_IMAGES=$(gcloud compute images list \
            --project="${{ vars.PACKER_PROJECT_ID }}" \
            --filter="family=gcrunner-${{ matrix.family }}" \
            --sort-by="~creationTimestamp" \
            --format="value(name)" | tail -n +3)
          for img in $OLD_IMAGES; do
            echo "Deleting old image: $img"
            gcloud compute images delete "$img" --project="${{ vars.PACKER_PROJECT_ID }}" --quiet
          done
