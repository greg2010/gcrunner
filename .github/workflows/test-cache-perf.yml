name: Cache performance comparison

on:
  workflow_dispatch:

jobs:
  cold:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: gcrunner
            runs_on: gcrunner=${{ github.run_id }}-cold/machine=e2-medium
          - runner: hosted
            runs_on: ubuntu-latest
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Set up test project
        run: |
          mkdir -p test-project
          cp .github/fixtures/cache-perf-package.json test-project/package.json

      - name: Install (cold)
        run: |
          cd test-project
          START=$(date +%s%N)
          bun install
          END=$(date +%s%N)
          ELAPSED=$(( (END - START) / 1000000 ))
          echo "## Install time (cold, ${{ matrix.runner }}): ${ELAPSED}ms" >> $GITHUB_STEP_SUMMARY

      - name: Save cache
        uses: actions/cache/save@v6
        with:
          path: |
            test-project/node_modules
            ~/.bun/install/cache
          key: bun-${{ matrix.runner }}-${{ hashFiles('test-project/package.json') }}

  warm:
    needs: cold
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: gcrunner
            runs_on: gcrunner=${{ github.run_id }}-warm/machine=e2-medium
          - runner: hosted
            runs_on: ubuntu-latest
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Set up test project
        run: |
          mkdir -p test-project
          cp .github/fixtures/cache-perf-package.json test-project/package.json

      - name: Restore cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            test-project/node_modules
            ~/.bun/install/cache
          key: bun-${{ matrix.runner }}-${{ hashFiles('test-project/package.json') }}

      - name: Cache status
        run: |
          echo "Cache hit: ${{ steps.cache.outputs.cache-hit }}"
          echo "Cache hit (${{ matrix.runner }}): ${{ steps.cache.outputs.cache-hit }}" >> $GITHUB_STEP_SUMMARY

      - name: Install (warm)
        run: |
          cd test-project
          START=$(date +%s%N)
          bun install
          END=$(date +%s%N)
          ELAPSED=$(( (END - START) / 1000000 ))
          echo "## Install time (warm, ${{ matrix.runner }}): ${ELAPSED}ms" >> $GITHUB_STEP_SUMMARY
