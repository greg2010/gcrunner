name: Deploy Terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "orchestrator/**"
      - ".github/workflows/deploy-terraform.yml"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

concurrency:
  group: terraform-deploy
  cancel-in-progress: false

jobs:
  publish-orchestrator:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      tags: latest ${{ github.sha }}

  deploy:
    needs: publish-orchestrator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEPLOY }}

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=gcrunner-main"

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="project_id=${{ vars.TF_PROJECT_ID }}" \
            -var="gcrunner_version=${{ github.sha }}" \
            -var="gcrunner_image_repo=${GITHUB_REPOSITORY,,}" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply tfplan

  smoke-test-n2d-go:
    needs: deploy
    runs-on: gcrunner=${{ github.run_id }}-n2d/machine=n2d-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum
      - name: Build orchestrator
        run: cd orchestrator && go build ./...
      - name: Test orchestrator
        run: cd orchestrator && go test -timeout 60s ./...

  smoke-test-e2-node:
    needs: deploy
    runs-on: gcrunner=${{ github.run_id }}-e2/machine=e2-medium
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Node smoke test
        run: node -e "console.log('Node', process.version, 'on', process.arch, process.platform)"
      - name: System info
        run: |
          echo "CPUs: $(nproc)"
          echo "Memory: $(free -h | awk '/Mem:/{print $2}')"
          df -h /

  smoke-test-c3-go:
    needs: deploy
    runs-on: gcrunner=${{ github.run_id }}-c3/family=c3/cpu=4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cache-server/go.mod
          cache-dependency-path: cache-server/go.sum
      - name: Build cache-server
        run: cd cache-server && go build ./...
      - name: Test cache-server
        run: cd cache-server && go test -timeout 60s ./...
