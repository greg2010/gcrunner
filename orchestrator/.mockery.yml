all: false
dir: '{{.InterfaceDir}}'
filename: mocks_test.go
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: info
structname: 'Mock{{.InterfaceName | exported}}'
pkgname: '{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/camdenclark/gcrunner/orchestrator:
    config:
      all: false
    interfaces:
      cloudTasksClientFactory: {}
      installationCredentialsResolver: {}
      runnerVMCreator: {}
      runnerVMDeleter: {}
      secretManagerClientFactory: {}
      taskTokenValidator: {}
      workflowJobStatusLookup: {}
